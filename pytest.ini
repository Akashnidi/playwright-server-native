[pytest]
# ---------------------------------------------------------------------------
# playwright-server-native — pytest configuration
# ---------------------------------------------------------------------------

# --- Test discovery ---
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --- Default CLI options ---
# Generates self-contained HTML report and executes with concise tracebacks
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# --- Custom markers ---
markers =
    smoke:         Fast sanity-check tests
    regression:    Full regression suite
    login:         Login-related tests
    inventory:     Product / inventory page tests
    cart:          Shopping-cart tests
    checkout:      Checkout-flow tests

# --- Logging (captured by pytest; also written to file via conftest.py) ---
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
